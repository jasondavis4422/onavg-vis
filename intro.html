<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human Brain Vertex Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: black;
      color: white;
    }

    #page-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #upload-container {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      z-index: 50;
    }

    #main-content {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    #brain-image {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    #table-container {
      position: fixed;
      /* stay in place while scrolling */
      bottom: 150px;
      /* distance from the bottom of the viewport */
      right: 10px;
      /* ← change: anchor to the right edge */
      font-size: 12px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 5px;
      z-index: 40;
    }

    #table-container table {
      border-collapse: collapse;
    }

    #table-container th,
    #table-container td {
      border: 0.5px solid white;
      padding: 4px;
      text-align: center;
    }

    #info-container {
      position: fixed;
      top: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      max-height: 80vh;
      overflow-y: auto;
      z-index: 60;
    }

    #vertex-info,
    #file-name {
      margin: 0;
      padding: 0;
    }

    /* button styling */
    #homepage-button {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100;
    }

    #homepage-button button {
      padding: 8px 12px;
      background-color: #4682b4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    /* Search panel (top‑right) */
    #search-panel {
      position: fixed;
      top: 10px;
      right: 120px;
      background-color: rgba(0, 0, 0, 0.8);
      padding: 8px;
      border-radius: 5px;
      font-size: 14px;
      z-index: 90;
    }

    #search-panel label,
    #search-panel select,
    #search-panel input,
    #search-panel button {
      margin-right: 6px;
    }

    #shading-panel {
      position: fixed;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.8);
      padding: 8px;
      border-radius: 5px;
      font-size: 14px;
      z-index: 85;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-direction: column;
      margin-top: 150px;
    }

    #toggle-shading-btn {
      padding: 8px 12px;
      background-color: #555;
      color: white;
      border: 2px solid #999;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    #toggle-shading-btn.active {
      background-color: #228b22;
      border-color: #00ff00;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
    }

    #finish-shading-btn {
      padding: 8px 12px;
      background-color: #4682b4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    #shading-status {
      color: #ccc;
      font-size: 12px;
      min-width: 150px;
    }

    #brain-image.shading-active {
      cursor: crosshair;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
    }

    /* MARKER – green "X" */
    .vertex-marker {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
      z-index: 120;
    }

    .vertex-marker::after {
      content: "X";
      color: rgba(0, 255, 0, 0.9);
      font-weight: bold;
      font-size: 14px;
      /* size of the X */
      position: absolute;
      left: -7px;
      /* centre the X on the click point */
      top: -7px;
    }

    /* replace the old .shading‑overlay rule – we keep it for backward compatibility */
    .shading-line {
      fill: none;
      stroke: rgba(0, 255, 0, 0.6);
      /* same colour as the old border */
      stroke-width: 2;
      /* thinner than the 10 px box */
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #clear-shading-btn {
      padding: 8px 12px;
      background-color: #8b4513;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
  <!-- Button to return to homepage -->
  <div id="homepage-button">
    <a href="instructions.html"><button>Instructions</button></a>
  </div>

  <div id="shading-panel">
    <button id="toggle-shading-btn">🖍️ Shade Region</button>
    <span id="shading-status">Shading OFF | Vertices: 0</span>
    <button id="finish-shading-btn">Finish & Export</button>
    <button id="clear-shading-btn">Clear Shading</button>
  </div>

  <!-- put this right after the <body> tag (or anywhere inside the page) -->
  <div id="shading-svg-container"
    style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:110;"></div>

  <!-- Search panel -->
  <div id="search-panel">
    <label for="ico-select">ICO space:</label>
    <select id="ico-select">
      <option value="ico8">ico8</option>
      <option value="ico16">ico16</option>
      <option value="ico32">ico32</option>
      <option value="ico64">ico64</option>
      <option value="ico128">ico128</option>
    </select>

    <label for="vertex-input">Vertex index:</label>
    <input type="number" id="vertex-input" min="0" placeholder="e.g. 123" />
    <button id="show-vertex-btn">Show</button>

    <label for="parc-select">Parcellation:</label>
    <select id="parc-select">
      <option value="destrieux">Destrieux</option>
      <option value="dk">DK</option>
      <option value="dkt">DKT</option>
    </select>

    <label for="region-select">Region:</label>
    <select id="region-select" disabled>
      <option value="">(loading…)</option>
    </select>
    <button id="show-region-btn">Show Region</button>
  </div>

  <div id="upload-container">
    <label for="imageUpload">Choose Brain Image File:</label>
    <input type="file" id="imageUpload" accept="image/*" />
    <br /><br />
    <label for="dataUpload">Choose Data File in TXT format:</label>
    <input type="file" id="dataUpload" accept=".txt" />
  </div>

  <div id="page-container">
    <div id="main-content">
      <div id="table-container">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>LH</th>
              <th>RH</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>ico8</td>
              <td>0-602</td>
              <td>603-1209</td>
            </tr>
            <tr>
              <td>ico16</td>
              <td>0-2416</td>
              <td>2417-4830</td>
            </tr>
            <tr>
              <td>ico32</td>
              <td>0-9674</td>
              <td>9675-19340</td>
            </tr>
            <tr>
              <td>ico64</td>
              <td>0-38697</td>
              <td>38698-77325</td>
            </tr>
            <tr>
              <td>ico128</td>
              <td>0-154785</td>
              <td>154786-309345</td>
            </tr>
          </tbody>
        </table>
      </div>
      <img id="brain-image" src="_static/ico8brain.png" alt="Brain Image" />
    </div>

    <div id="info-container">
      <p id="file-name"></p>
      <p id="vertex-info">
        Hover over the image to see vertex information. <br>
        Each vertex contains the relevant numerical and <br>
        string‑labeled parcel in the human brain.
      </p>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------------
    // GLOBAL VARIABLES
    // -----------------------------------------------------------------
    let mappingData = null,
      lookupTableIco8 = null,
      lookupTableIco16 = null,
      lookupTableIco32 = null,
      lookupTableIco64 = null,
      lookupTableIco128 = null,
      dataMatrix = null,
      currentIcoSpace = null,
      ds128_aparc = null,
      ds128_aparc_a2009s = null,
      ds128_aparc_DKTatlas = null,
      destrieux_aparc = null,
      dk_aparc = null,
      dkt_aparc = null,
      originalWidth = 0,
      originalHeight = 0,
      scaleX = 1,
      scaleY = 1;          // array of "x,y" strings

    // Shading mode variables
    let shadingModeActive = false;
    let isDrawing = false;
    let shadedVerticesSet = new Set();
    let shadedOverlays = [];
    let shadingSvg = null;          // the <svg> element
    let shadingPoly = null;         // the <polyline> that we update
    let currentPath = [];

    const image = $('#brain-image');
    const vertexInfo = $('#vertex-info');
    const fileNameInfo = $('#file-name');


    // -----------------------------------------------------------------
    // UTILITY FUNCTIONS
    // -----------------------------------------------------------------
    function determineIcoSpace(dataLength) {
      switch (dataLength) {
        case 1210: return 'ico8';
        case 4831: return 'ico16';
        case 19341: return 'ico32';
        case 77326: return 'ico64';
        case 309346: return 'ico128';
        default: return null;
      }
    }

    function getLookupTable(icoSpace) {
      switch (icoSpace) {
        case 'ico8': return lookupTableIco8;
        case 'ico16': return lookupTableIco16;
        case 'ico32': return lookupTableIco32;
        case 'ico64': return lookupTableIco64;
        case 'ico128': return lookupTableIco128;
        default: return null;
      }
    }

    function displayFileName() {
      const fileName = image.attr('src').split('/').pop();
      fileNameInfo.text(`File: ${fileName}`);
    }

    function updateDisplaySize() {
      const rect = image[0].getBoundingClientRect();
      const displayWidth = rect.width;
      const displayHeight = rect.height;
      scaleX = originalWidth / displayWidth;
      scaleY = originalHeight / displayHeight;
    }

    function getVertexFromMapping(mx, my) {
      if (my >= 0 && my < originalHeight && mx >= 0 && mx < originalWidth) {
        const v = mappingData[my][mx];
        return v !== -1 ? v : null;
      }
      return null;
    }

    // -----------------------------------------------------------------
    // LOAD ALL JSON FILES
    // -----------------------------------------------------------------
    function loadData() {
      $.when(
        $.getJSON('_static/mapping_data_ico128.json', data => {
          mappingData = data;
          originalHeight = mappingData.length;
          originalWidth = mappingData[0].length;
        }),
        $.getJSON('_static/lookup_table_ico8.json', data => lookupTableIco8 = data),
        $.getJSON('_static/lookup_table_ico16.json', data => lookupTableIco16 = data),
        $.getJSON('_static/lookup_table_ico32.json', data => lookupTableIco32 = data),
        $.getJSON('_static/lookup_table_ico64.json', data => lookupTableIco64 = data),
        $.getJSON('_static/lookup_table_ico128.json', data => lookupTableIco128 = data),
        $.getJSON('_static/ds128_aparc.json', data => ds128_aparc = data),
        $.getJSON('_static/ds128_aparc.a2009s.json', data => ds128_aparc_a2009s = data),
        $.getJSON('_static/ds128_aparc.DKTatlas.json', data => ds128_aparc_DKTatlas = data),
        $.getJSON('_static/destrieux_labels.json', data => destrieux_aparc = data),
        $.getJSON('_static/dk_labels.json', data => dk_aparc = data),
        $.getJSON('_static/dkt_labels.json', data => dkt_aparc = data)
      ).done(() => {
        updateDisplaySize();
      });
    }

    function getVertexCoordinates(icoSpace, vertex) {
      const table = getLookupTable(icoSpace);
      const index = table.indexOf(vertex);

      if (index === -1) return [];

      const coords = [];
      for (let y = 0; y < originalHeight; y++) {
        const row = mappingData[y];
        for (let x = 0; x < originalWidth; x++) {
          if (row[x] === index) {
            coords.push([x, y]);
          }
        }
      }
      return coords;
    }

    function getCoordinates(icoSpace, index_val) {
      const table = getLookupTable(icoSpace);
      if (index_val === -1) return [];

      const coords = [];
      for (let y = 0; y < originalHeight; y++) {
        const row = mappingData[y];
        for (let x = 0; x < originalWidth; x++) {
          if (row[x] === index_val) {
            coords.push([x, y]);
          }
        }
      }
      return coords;
    }

    function validateVertex(icoSpace, vertex) {
      const table = getLookupTable(icoSpace);
      return table && vertex >= 0 && table.includes(vertex);
    }

    function drawMarker(xScreen, yScreen) {
      const $m = $('<div class="vertex-marker"></div>');
      const imgOffset = image.offset();
      $m.css({
        left: imgOffset.left + xScreen,
        top: imgOffset.top + yScreen
      });
      $('body').append($m);
    }

    function startSvgLine() {
      // create <svg> (full‑screen overlay)
      shadingSvg = $('<svg></svg>').attr({
        width: '100%',
        height: '100%',
        viewBox: `0 0 ${window.innerWidth} ${window.innerHeight}`
      }).appendTo('#shading-svg-container');

      // create the <polyline> that will hold the points
      shadingPoly = $('<polyline></polyline>').addClass('shading-line')
        .attr('points', '');
      shadingSvg.append(shadingPoly);
    }

    // -----------------------------------------------------------------
    // UI – file uploads
    // -----------------------------------------------------------------
    $('#imageUpload').on('change', function (e) {
      const file = e.target.files[0];
      if (file) {
        fileNameInfo.text(`File: ${file.name}`);
        const url = URL.createObjectURL(file);
        image.attr('src', url).on('load', updateDisplaySize);
      }
    });

    $('#dataUpload').on('change', function (e) {
      const file = e.target.files[0];
      if (file) {
        fileNameInfo.text(`Data Matrix File: ${file.name}`);

        const reader = new FileReader();
        reader.onload = function (event) {
          try {
            const textContent = event.target.result;
            dataMatrix = textContent
              .replace(/\n/g, '')
              .replace(/[\[\]]/g, '')
              .split(',')
              .map(v => v.trim())
              .filter(v => v.length > 0)
              .map(v => parseFloat(v));

            const dataLength = dataMatrix.length;
            currentIcoSpace = determineIcoSpace(dataLength);
          } catch (err) {
            console.error('Error parsing TXT file:', err);
            dataMatrix = null;
            currentIcoSpace = null;
          }
        };
        reader.readAsText(file);
      }
    });

    // -----------------------------------------------------------------
    // UI – numeric‑vertex lookup
    // -----------------------------------------------------------------
    $('#show-vertex-btn').on('click', () => {
      const ico = $('#ico-select').val();
      const vStr = $('#vertex-input').val();

      if (vStr === '' || isNaN(vStr)) {
        alert('Please type a numeric vertex index.');
        return;
      }
      const vertex = parseInt(vStr, 10);
      if (!validateVertex(ico, vertex)) {
        alert(`Vertex ${vertex} is not valid for ${ico}.`);
        return;
      }

      const allCoords = getVertexCoordinates(ico, vertex);
      if (allCoords.length === 0) {
        alert(`Vertex ${vertex} does not appear in the mapping image.`);
        return;
      }

      $('.vertex-marker').remove();
      allCoords.forEach(coord => {
        const [origX, origY] = coord;
        const screenX = Math.round(origX / scaleX);
        const screenY = Math.round(origY / scaleY);
        drawMarker(screenX, screenY);
      });
    });

    // -----------------------------------------------------------------
    // REGION DROPDOWN – fill with names from selected parcellation
    // -----------------------------------------------------------------
    function fillRegionDropdown(parc) {
      let table;
      switch (parc) {
        case 'destrieux': table = destrieux_aparc; break;
        case 'dk': table = dk_aparc; break;
        case 'dkt': table = dkt_aparc; break;
        default: return;
      }
      if (!table) return;

      const unique = Array.from(new Set(table)).filter(Boolean).sort();
      const $sel = $('#region-select');
      $sel.empty().append('<option value="">(choose a region)</option>');
      unique.forEach(name => $sel.append(`<option value="${name}">${name}</option>`));
      $sel.prop('disabled', false);
    }

    $('#parc-select').on('change', function () {
      const parc = $(this).val();
      const loaded = (parc === 'destrieux' && destrieux_aparc) ||
        (parc === 'dk' && dk_aparc) ||
        (parc === 'dkt' && dkt_aparc);
      if (!loaded) {
        alert(`Parcellation data for "${parc}" is not yet loaded.`);
        return;
      }
      fillRegionDropdown(parc);
    });

    // -----------------------------------------------------------------
    // Helper – get the first vertex index that matches a region name
    // -----------------------------------------------------------------
    function getIndexForRegion(parc, name) {
      let table;
      switch (parc) {
        case 'destrieux': table = destrieux_aparc; break;
        case 'dk': table = dk_aparc; break;
        case 'dkt': table = dkt_aparc; break;
        default: return null;
      }
      if (!table) return null;
      const idx = table.indexOf(name);
      return idx >= 0 ? idx : null;
    }

    // -----------------------------------------------------------------
    // Show region (now using the dropdown)
    // -----------------------------------------------------------------
    function showRegion(parc, name) {
      const vertexIdx = getIndexForRegion(parc, name);
      if (vertexIdx === null) {
        alert(`Region "${name}" not found in ${parc} parcellation.`);
        return;
      }

      const coords = getCoordinates('ico8', vertexIdx);
      if (coords.length === 0) {
        alert(`Vertex ${vertexIdx} does not appear in the mapping image.`);
        return;
      }

      const [origX, origY] = coords[0];
      const screenX = Math.round(origX / scaleX);
      const screenY = Math.round(origY / scaleY);

      $('.vertex-marker').remove();
      drawMarker(screenX, screenY);
    }

    // -----------------------------------------------------------------
    // UI – region‑by‑name button (uses dropdown)
    // -----------------------------------------------------------------
    $('#show-region-btn').on('click', () => {
      const parc = $('#parc-select').val();
      const name = $('#region-select').val();

      if (!name) {
        alert('Please select a region from the list.');
        return;
      }

      const tableLoaded = (parc === 'destrieux' && destrieux_aparc) ||
        (parc === 'dk' && dk_aparc) ||
        (parc === 'dkt' && dkt_aparc);
      if (!tableLoaded) {
        alert(`Parcellation data for "${parc}" is not yet loaded.`);
        return;
      }

      showRegion(parc, name);
    });


    // -----------------------------------------------------------------
    // SHADING FEATURE FUNCTIONS
    // -----------------------------------------------------------------
    function toggleShadingMode() {
      shadingModeActive = !shadingModeActive;
      const $btn = $('#toggle-shading-btn');

      if (shadingModeActive) {
        $btn.addClass('active');
        image.addClass('shading-active');
        updateShadingStatus();
      } else {
        $btn.removeClass('active');
        image.removeClass('shading-active');
        updateShadingStatus();
      }
    }

    function updateShadingStatus() {
      const status = shadingModeActive ? 'ON' : 'OFF';
      const count = shadedVerticesSet.size;
      $('#shading-status').text(`Shading ${status} | Vertices: ${count}`);
    }

    function recordShadedVertex(mouseXOrig, mouseYOrig) {
      const vertex = getVertexFromMapping(mouseXOrig, mouseYOrig);

      if (vertex === null || shadedVerticesSet.has(vertex)) return; // nothing new

      // ---- 1️⃣  Store the vertex for the report  ----
      shadedVerticesSet.add(vertex);
      updateShadingStatus();

      // ---- 2️⃣  Build / extend the SVG line  ----
      // First time we draw during this mouse‑down session → create SVG
      if (!shadingSvg) startSvgLine();

      // Convert original image coordinates back to screen space
      const screenX = Math.round(mouseXOrig / scaleX);
      const screenY = Math.round(mouseYOrig / scaleY);
      currentPath.push(`${screenX},${screenY}`);

      // Update the <polyline> points attribute
      shadingPoly.attr('points', currentPath.join(' '));
    }
    function clearShading() {
      shadedVerticesSet.clear();
      shadedOverlays.forEach($overlay => $overlay.remove());
      shadedOverlays = [];

      if (shadingSvg) {
        shadingSvg.remove();
        shadingSvg = null;
        shadingPoly = null;
        currentPath = [];
      }
      updateShadingStatus();
    }

    function convertVertexToAllSpaces(mappingIndex) {
      const result = {
        ico8: lookupTableIco8[mappingIndex],
        ico16: lookupTableIco16[mappingIndex],
        ico32: lookupTableIco32[mappingIndex],
        ico64: lookupTableIco64[mappingIndex],
        ico128: lookupTableIco128[mappingIndex]
      };
      return result;
    }

    function convertVertexToAllParcellations(mappingIndex) {
      const result = {
        ds128_aparc: ds128_aparc ? ds128_aparc[mappingIndex] : 'N/A',
        ds128_aparc_a2009s: ds128_aparc_a2009s ? ds128_aparc_a2009s[mappingIndex] : 'N/A',
        ds128_aparc_DKTatlas: ds128_aparc_DKTatlas ? ds128_aparc_DKTatlas[mappingIndex] : 'N/A',
        destrieux: destrieux_aparc ? destrieux_aparc[mappingIndex] : 'N/A',
        dk: dk_aparc ? dk_aparc[mappingIndex] : 'N/A',
        dkt: dkt_aparc ? dkt_aparc[mappingIndex] : 'N/A'
      };
      return result;
    }

    function generateShadingReport() {
      if (shadedVerticesSet.size === 0) {
        alert('No vertices have been shaded. Please shade a region first.');
        return null;
      }

      let reportText = '=== BRAIN VERTEX SHADING REPORT ===\n\n';
      reportText += `Total vertices shaded: ${shadedVerticesSet.size}\n`;
      reportText += `Timestamp: ${new Date().toISOString()}\n\n`;

      // Sort vertices for consistent output
      const sortedVertices = Array.from(shadedVerticesSet).sort((a, b) => a - b);

      reportText += '=== ICO SPACE CONVERSIONS ===\n\n';

      const ico8Vertices = new Set();
      const ico16Vertices = new Set();
      const ico32Vertices = new Set();
      const ico64Vertices = new Set();
      const ico128Vertices = new Set();

      sortedVertices.forEach(mappingIdx => {
        const spaces = convertVertexToAllSpaces(mappingIdx);
        ico8Vertices.add(spaces.ico8);
        ico16Vertices.add(spaces.ico16);
        ico32Vertices.add(spaces.ico32);
        ico64Vertices.add(spaces.ico64);
        ico128Vertices.add(spaces.ico128);
      });

      reportText += `ICO8 Vertices (${ico8Vertices.size}):\n`;
      reportText += Array.from(ico8Vertices).sort((a, b) => a - b).join(', ') + '\n\n';

      reportText += `ICO16 Vertices (${ico16Vertices.size}):\n`;
      reportText += Array.from(ico16Vertices).sort((a, b) => a - b).join(', ') + '\n\n';

      reportText += `ICO32 Vertices (${ico32Vertices.size}):\n`;
      reportText += Array.from(ico32Vertices).sort((a, b) => a - b).join(', ') + '\n\n';

      reportText += `ICO64 Vertices (${ico64Vertices.size}):\n`;
      reportText += Array.from(ico64Vertices).sort((a, b) => a - b).join(', ') + '\n\n';

      reportText += `ICO128 Vertices (${ico128Vertices.size}):\n`;
      reportText += Array.from(ico128Vertices).sort((a, b) => a - b).join(', ') + '\n\n';

      reportText += '=== ANATOMICAL PARCELLATIONS ===\n\n';

      const destrieixLabels = new Set();
      const dkLabels = new Set();
      const dktLabels = new Set();
      const ds128Aparc = new Set();
      const ds128AparcA2009s = new Set();
      const ds128AparcDKT = new Set();

      sortedVertices.forEach(mappingIdx => {
        const parcs = convertVertexToAllParcellations(mappingIdx);
        destrieixLabels.add(parcs.destrieux);
        dkLabels.add(parcs.dk);
        dktLabels.add(parcs.dkt);
        ds128Aparc.add(parcs.ds128_aparc);
        ds128AparcA2009s.add(parcs.ds128_aparc_a2009s);
        ds128AparcDKT.add(parcs.ds128_aparc_DKTatlas);
      });

      reportText += `Destrieux Labels (${destrieixLabels.size}):\n`;
      reportText += Array.from(destrieixLabels).filter(x => x !== 'N/A').sort().join(', ') + '\n\n';

      reportText += `DK Labels (${dkLabels.size}):\n`;
      reportText += Array.from(dkLabels).filter(x => x !== 'N/A').sort().join(', ') + '\n\n';

      reportText += `DKT Labels (${dktLabels.size}):\n`;
      reportText += Array.from(dktLabels).filter(x => x !== 'N/A').sort().join(', ') + '\n\n';

      reportText += `DS128 APARC (${ds128Aparc.size}):\n`;
      reportText += Array.from(ds128Aparc).filter(x => x !== 'N/A').sort().join(', ') + '\n\n';

      reportText += `DS128 APARC.A2009s (${ds128AparcA2009s.size}):\n`;
      reportText += Array.from(ds128AparcA2009s).filter(x => x !== 'N/A').sort().join(', ') + '\n\n';

      reportText += `DS128 APARC.DKTatlas (${ds128AparcDKT.size}):\n`;
      reportText += Array.from(ds128AparcDKT).filter(x => x !== 'N/A').sort().join(', ') + '\n\n';

      reportText += '=== DETAILED VERTEX MAPPING ===\n\n';
      reportText += 'MappingIndex | ICO8 | ICO16 | ICO32 | ICO64 | ICO128 | Destrieux | DK | DKT | DS128-aparc | DS128-a2009s | DS128-DKT\n';
      reportText += '-'.repeat(150) + '\n';

      sortedVertices.forEach(mappingIdx => {
        const spaces = convertVertexToAllSpaces(mappingIdx);
        const parcs = convertVertexToAllParcellations(mappingIdx);
        reportText += `${mappingIdx} | ${spaces.ico8} | ${spaces.ico16} | ${spaces.ico32} | ${spaces.ico64} | ${spaces.ico128} | ${parcs.destrieux} | ${parcs.dk} | ${parcs.dkt} | ${parcs.ds128_aparc} | ${parcs.ds128_aparc_a2009s} | ${parcs.ds128_aparc_DKTatlas}\n`;
      });

      return reportText;
    }

    function downloadTextFile(text, filename) {
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function finishShadingAndExport() {
      const report = generateShadingReport();
      if (report) {
        const timestamp = new Date().toISOString().slice(0, 10);
        const filename = `brain_shading_report_${timestamp}.txt`;
        downloadTextFile(report, filename);

        // Optional: clear shading after export
        const userConfirm = confirm('Export complete! Clear shading for a new selection?');
        if (userConfirm) {
          clearShading();
        }
      }
    }


    // -----------------------------------------------------------------
    // SHADING MODE EVENT HANDLERS (updated)
    // -----------------------------------------------------------------
    $('#toggle-shading-btn').on('click', function () {
      toggleShadingMode();
    });

    $('#finish-shading-btn').on('click', function () {
      if (shadedVerticesSet.size === 0) {
        alert('No vertices shaded. Please shade a region first.');
        return;
      }
      finishShadingAndExport();
    });

    $('#clear-shading-btn').on('click', function () {
      clearShading();
    });

    // Stop drawing when the mouse button is released – even if the cursor
    // is outside the image area.
    $(document).on('mouseup', function () {
      if (shadingModeActive) {
        isDrawing = false;
      }
    });

    image.on('dragstart', function (e) {
      if (shadingModeActive) {
        e.preventDefault();
        return false;
      }
    });

    image.on('mousedown', function (e) {
      if (shadingModeActive) {
        e.preventDefault();
      }
      if (!shadingModeActive) return;
      isDrawing = true;               // start drawing only while mouse is down
    });

    image.on('mousemove', function (e) {
      if (!shadingModeActive || !isDrawing) return;

      const rect = this.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
        const mouseXOrig = Math.floor(x * scaleX);
        const mouseYOrig = Math.floor(y * scaleY);
        recordShadedVertex(mouseXOrig, mouseYOrig);
      }
    });

    image.on('mouseleave', function () {
      isDrawing = false;          // stop adding points
      // Stop the line when the mouse leaves the image
      if (shadingSvg) {
        shadingSvg.remove();
        shadingSvg = null;
        shadingPoly = null;
        currentPath = [];
      }
    });
    // -----------------------------------------------------------------
    // Hover info
    // -----------------------------------------------------------------
    image.on('mousemove', function (e) {
      const rect = this.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
        const mouseXOrig = Math.floor(x * scaleX);
        const mouseYOrig = Math.floor(y * scaleY);
        const vertex = getVertexFromMapping(mouseXOrig, mouseYOrig);

        if (vertex !== null) {
          const ico8 = lookupTableIco8[vertex];
          const ico16 = lookupTableIco16[vertex];
          const ico32 = lookupTableIco32[vertex];
          const ico64 = lookupTableIco64[vertex];
          const ico128 = lookupTableIco128[vertex];

          const ds128_aparc_val = ds128_aparc ? ds128_aparc[vertex] : 'N/A';
          const ds128_aparc_a2009s_val = ds128_aparc_a2009s ? ds128_aparc_a2009s[vertex] : 'N/A';
          const ds128_aparc_DKTatlas_val = ds128_aparc_DKTatlas ? ds128_aparc_DKTatlas[vertex] : 'N/A';

          const destrieux = destrieux_aparc ? destrieux_aparc[vertex] : 'N/A';
          const dk = dk_aparc ? dk_aparc[vertex] : 'N/A';
          const dkt = dkt_aparc ? dkt_aparc[vertex] : 'N/A';

          let dataValue = 'N/A';
          if (dataMatrix && currentIcoSpace) {
            const lt = getLookupTable(currentIcoSpace);
            if (lt) {
              const idx = lt[vertex];
              dataValue = dataMatrix[idx] !== undefined ? dataMatrix[idx] : 'N/A';
            }
          }

          const html = `
            <br><strong>onavg coordinate:</strong><br>
            ico8: ${ico8}<br>
            ico16: ${ico16}<br>
            ico32: ${ico32}<br>
            ico64: ${ico64}<br>
            ico128: ${ico128}<br><br>

            <strong> parcellation number (ico8):</strong><br>
            aparc: ${ds128_aparc_val}<br>
            aparc.a2009s: ${ds128_aparc_a2009s_val}<br>
            aparc.DKTatlas: ${ds128_aparc_DKTatlas_val}<br><br>

            <strong>onavg anatomical parcellation (ico8):</strong><br>
            destrieux: ${destrieux}<br>
            dk: ${dk}<br>
            dkt: ${dkt}<br><br>

            <strong>Data Matrix Value in ${currentIcoSpace || '—'} space:</strong><br>
            value: ${dataValue}<br><br>
          `;
          vertexInfo.html(html);
        } else {
          vertexInfo.text('No vertex selected');
        }
      } else {
        vertexInfo.text('No vertex selected');
      }
    });

    image.on('mouseleave', () => { vertexInfo.text('No vertex selected'); });

    // -----------------------------------------------------------------
    // Initialise everything
    // -----------------------------------------------------------------
    $(document).ready(() => {
      displayFileName();
      loadData();
      $(window).on('resize', updateDisplaySize);
    });
  </script>
</body>

</html>
